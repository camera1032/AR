<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1">

  <style>

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #cameraFeed {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    #hint {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 9999;
      color: white;
      font-size: 14px;
      background: rgba(0,0,0,.5);
      padding: 8px;
      border-radius: 8px;
    }

    #startBtn {
      position: fixed;
      z-index: 10000;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 12px 18px;
      cursor: pointer;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      z-index: 2;
    }

  </style>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>

<body>

  <!-- camera -->
  <video
    id="cameraFeed"
    autoplay
    muted
    playsinline>
  </video>


  <!-- start -->
  <button id="startBtn">
    Start AR
  </button>


  <!-- status -->
  <div id="hint">
    กดเริ่ม
  </div>


  <!-- AR -->
  <a-scene
    id="scene"
    mindar-image="
      imageTargetSrc: ./images/ar-obj/targets.mind;
      uiScanning: no;
    "
    embedded
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
    style="display:none;"
  >

    <!-- preload -->
    <a-assets>

      <img
        id="logoObj"
        src="./images/ar-obj/1.png">

      <img
        id="hiluxObj"
        src="./images/ar-obj/2.png">

      <img
        id="fortunerObj"
        src="./images/ar-obj/3.png">

      <img
        id="corollaObj"
        src="./images/ar-obj/4.png">

    </a-assets>


    <!-- target 0 -->
    <a-entity
      mindar-image-target="targetIndex: 0">

      <a-plane
        src="#logoObj"
        width="1"
        height="1"
        material="
          transparent:true;
          side:double;
          npot:true;
        ">
      </a-plane>

    </a-entity>


    <!-- target 1 -->
    <a-entity
      mindar-image-target="targetIndex: 1">

      <a-plane
        src="#hiluxObj"
        width="1.2"
        height="1"
        material="
          transparent:true;
          side:double;
          npot:true;
        ">
      </a-plane>

    </a-entity>


    <!-- target 2 -->
    <a-entity
      mindar-image-target="targetIndex: 2">

      <a-plane
        src="#fortunerObj"
        width="1.2"
        height="1"
        material="
          transparent:true;
          side:double;
          npot:true;
        ">
      </a-plane>

    </a-entity>


    <!-- target 3 -->
    <a-entity
      mindar-image-target="targetIndex: 3">

      <a-plane
        src="#corollaObj"
        width="1.2"
        height="1"
        material="
          transparent:true;
          side:double;
          npot:true;
        ">
      </a-plane>

    </a-entity>


    <!-- target 4 = poster -->
    <a-entity
      mindar-image-target="targetIndex: 4">

      <!-- top logo -->
      <a-plane
        src="#logoObj"
        position="0 1.6 0"
        width="0.7"
        height="0.7"
        material="
          transparent:true;
          side:double;
          npot:true;
        ">
      </a-plane>


      <!-- car 1 -->
      <a-plane
        src="#hiluxObj"
        position="0 0.4 0"
        width="1.3"
        height="0.8"
        material="
          transparent:true;
          side:double;
          npot:true;
        ">
      </a-plane>


      <!-- car 2 -->
      <a-plane
        src="#fortunerObj"
        position="0 -0.8 0"
        width="1.3"
        height="0.8"
        material="
          transparent:true;
          side:double;
          npot:true;
        ">
      </a-plane>


      <!-- car 3 -->
      <a-plane
        src="#corollaObj"
        position="0 -2.0 0"
        width="1.3"
        height="0.8"
        material="
          transparent:true;
          side:double;
          npot:true;
        ">
      </a-plane>

    </a-entity>


    <a-camera></a-camera>

  </a-scene>


  <script>

    const video =
      document.getElementById("cameraFeed");

    const scene =
      document.getElementById("scene");

    const startBtn =
      document.getElementById("startBtn");

    const hint =
      document.getElementById("hint");


    startBtn.onclick = async () => {

      try {

        const stream =
          await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "environment"
            }
          });

        video.srcObject = stream;

        await video.play();

        scene.style.display = "block";

        await new Promise(resolve => {

          if (scene.hasLoaded) {

            resolve();

          }

          else {

            scene.addEventListener(
              "loaded",
              resolve,
              { once:true }
            );

          }

        });

        const arSystem =
          scene.systems["mindar-image-system"];

        await arSystem.start();

        startBtn.style.display = "none";

        hint.textContent =
          "พร้อมสแกน";

      }

      catch(error) {

        console.error(error);

        hint.textContent =
          "เปิดกล้องไม่สำเร็จ";

      }

    };

  </script>

</body>

</html>
